<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="36" font-size="18" font-weight="700" fill="#0f172a">APPLICATION STATE LIFECYCLE (STATE MACHINE)</text>
  <text x="40" y="56" font-size="12" fill="#64748b">Formal underwriting state transitions from application draft to maturity or 3MOB default</text>

  <!-- Initial State Dot -->
  <circle cx="60" cy="120" r="12" fill="#0f172a"/>
  <circle cx="60" cy="120" r="6" fill="#ffffff"/>
  <line x1="72" y1="120" x2="110" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STATE: DRAFT -->
  <g transform="translate(115, 95)" filter="url(#shadow)">
    <rect width="105" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="52" y="30" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">DRAFT</text>
  </g>

  <!-- Flow to SUBMITTED -->
  <line x1="220" y1="120" x2="265" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="242" y="112" font-size="9" fill="#64748b" text-anchor="middle">Submit</text>

  <!-- STATE: SUBMITTED -->
  <g transform="translate(270, 95)" filter="url(#shadow)">
    <rect width="120" height="50" rx="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="30" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">SUBMITTED</text>
  </g>

  <!-- Path: Knock-Out Failure (Downward) -->
  <path d="M 330 145 L 330 220" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="338" y="185" font-size="9" font-weight="600" fill="#dc2626">Knock-out Fail</text>

  <!-- STATE: PRE_SCREEN_FAILED -->
  <g transform="translate(235, 225)" filter="url(#shadow)">
    <rect width="190" height="50" rx="25" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="95" y="30" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">PRE_SCREEN_FAILED</text>
  </g>
  <!-- End marker from Pre-screen Failed -->
  <line x1="330" y1="275" x2="330" y2="310" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="330" cy="325" r="10" fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="330" cy="325" r="5" fill="#64748b"/>

  <!-- Path: Knock-Out Pass (Rightward) -->
  <line x1="390" y1="120" x2="445" y2="120" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="417" y="112" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">Pass</text>

  <!-- STATE: SCORING_IN_PROGRESS -->
  <g transform="translate(450, 95)" filter="url(#shadow)">
    <rect width="180" height="50" rx="25" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="90" y="30" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">SCORING_COMPLETE</text>
  </g>

  <!-- Flow to PENDING_OFFICER_REVIEW -->
  <line x1="630" y1="120" x2="685" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="657" y="112" font-size="9" fill="#64748b" text-anchor="middle">Route</text>

  <!-- STATE: PENDING_OFFICER_REVIEW -->
  <g transform="translate(690, 85)" filter="url(#shadow)">
    <rect width="230" height="70" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="115" y="32" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">PENDING_OFFICER_REVIEW</text>
    <text x="115" y="52" font-size="10" fill="#78350f" text-anchor="middle">(HITL Workbench Decision)</text>
  </g>

  <!-- Decisions from Officer Review -->
  <!-- 1. APPROVED (Downward Green) -->
  <path d="M 805 155 L 805 220" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="815" y="185" font-size="9" font-weight="700" fill="#059669">Approve</text>

  <g transform="translate(735, 225)" filter="url(#shadow)">
    <rect width="140" height="48" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="70" y="29" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">APPROVED</text>
  </g>

  <!-- Approved -> DISBURSED -->
  <line x1="805" y1="273" x2="805" y2="310" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <g transform="translate(735, 315)" filter="url(#shadow)">
    <rect width="140" height="48" rx="24" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
    <text x="70" y="29" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">DISBURSED</text>
  </g>

  <!-- Disbursed to Outcome: MATURED or DEFAULT -->
  <path d="M 735 340 L 610 340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="665" y="332" font-size="9" fill="#047857" text-anchor="middle">Good 3MOB</text>
  <rect x="500" y="322" width="105" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="552" y="344" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">MATURED_GOOD</text>

  <path d="M 875 340 L 930 340 L 930 400 L 760 400" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="650" y="388" width="105" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="702" y="405" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">DEFAULTED_3MOB</text>

  <!-- 2. REJECTED (Rightward Red) -->
  <path d="M 920 120 L 950 120 L 950 220" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <g transform="translate(885, 225)" filter="url(#shadow)">
    <rect width="90" height="48" rx="24" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="45" y="29" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">REJECTED</text>
  </g>

  <!-- 3. ADDITIONAL_INFO_REQUESTED (Loopback) -->
  <path d="M 805 85 L 805 45 L 540 45 L 540 90" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <rect x="620" y="35" width="130" height="20" rx="4" fill="#fffbeb"/>
  <text x="685" y="48" font-size="9" font-weight="600" fill="#b45309" text-anchor="middle">Request More Data</text>
</svg>
